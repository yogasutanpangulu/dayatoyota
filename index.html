<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sistem - Daya Toyota</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .portal-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        .portal-header h1 {
            color: #d9534f;
            margin: 0 0 10px 0;
            font-size: 32px;
            letter-spacing: 1px;
        }
        .portal-header p {
            color: #6c757d;
            margin: 0 0 30px 0;
            font-size: 16px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .menu-card {
            background: #ffffff;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-card:hover {
            border-color: #007bff;
            box-shadow: 0 5px 15px rgba(0,123,255,0.15);
            transform: translateY(-5px);
        }
        .menu-card .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .menu-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #0056b3;
        }
        .menu-card p {
            margin: 0;
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }
        
        /* Pewarnaan Khusus per Kartu */
        .card-antrian:hover { border-color: #d9534f; box-shadow: 0 5px 15px rgba(217,83,79,0.15); }
        .card-antrian h3 { color: #d9534f; }
        
        .card-laporan:hover { border-color: #28a745; box-shadow: 0 5px 15px rgba(40,167,69,0.15); }
        .card-laporan h3 { color: #28a745; }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
            .portal-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="portal-header">
            <h1>🚗 DAYA TOYOTA</h1>
            <p>Pilih sistem yang ingin Anda akses</p>
        </div>

        <div class="menu-grid">
            <!-- Link menuju file antrian.html -->
            <a href="antrian.html" class="menu-card card-antrian">
                <div class="icon">👥</div>
                <h3>Sistem Antrian</h3>
                <p>Input nomor antrian, panggilan counter, dan monitor pelanggan.</p>
            </a>

            <!-- Link menuju file laporan.html -->
            <a href="laporan.html" class="menu-card card-laporan">
                <div class="icon">📊</div>
                <h3>Rekap Laporan</h3>
                <p>Input Unit Entry, Revenue harian, dan generate laporan WhatsApp.</p>
            </a>
        </div>
        
        <p style="margin-top: 30px; font-size: 12px; color: #aaa;">&copy; 2026 Daya Toyota Service System</p>
    </div>

</body>
</html>
