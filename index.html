<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Daya Toyota Service System</title>
    <style>
        :root { --primary: #4361ee; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; }
        body { 
            margin: 0; 
            background: var(--bg); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .portal-container {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 8px 0;
            color: #d9534f;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-card {
            background: #ffffff;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            padding: 30px 20px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 12px 20px rgba(67, 97, 238, 0.12);
        }

        .icon-box {
            font-size: 40px;
            margin-bottom: 15px;
            background: #f8fafc;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .menu-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .menu-card:nth-child(1) .menu-title { color: #d9534f; }
        .menu-card:nth-child(2) .menu-title { color: #10b981; }

        .menu-desc {
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
            text-align: center;
        }

        .footer-text {
            font-size: 11px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <h2>🚗 DAYA TOYOTA</h2>
        <div class="subtitle">Pilih sistem yang ingin Anda akses</div>

        <div class="menu-grid">
            <!-- Menu 1: Sistem Antrian / Penerimaan -->
            <a href="dashboard.html" class="menu-card">
                <div class="icon-box">👥</div>
                <div class="menu-title">Sistem Antrian</div>
                <div class="menu-desc">Input nomor antrian, panggilan counter, dan monitor pelanggan.</div>
            </a>

            <!-- Menu 2: Rekap Laporan / Revenue -->
            <a href="rekap.html" class="menu-card">
                <div class="icon-box">📊</div>
                <div class="menu-title">Rekap Laporan</div>
                <div class="menu-desc">Input Unit Entry, Revenue harian, dan generate laporan WhatsApp.</div>
            </a>
        </div>

        <div class="footer-text">
            &copy; 2026 Daya Toyota Service System
        </div>
    </div>

</body>
</html>
